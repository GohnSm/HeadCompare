<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Равнобедренные трапеции</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
  }
  canvas {
    border-right: 1px solid #ccc;
    background: #fff;
  }
  .panel {
    width: 420px;
    padding: 10px;
    overflow-y: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 10px;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 4px;
    text-align: center;
  }
  tr.selected {
    background: #ffeeba;
  }
  button {
    margin: 4px 0;
    width: 100%;
  }
  h3 {
    margin: 10px 0 4px;
  }
</style>
</head>
<body>

<canvas id="canvas" width="800" height="600"></canvas>

<div class="panel">
  <h3>Набор 1</h3>
  <table id="table1">
    <tr>
      <th>h</th>
      <th>b₁</th>
      <th>b₂</th>
    </tr>
  </table>
  <button onclick="addTrapezoid(0)">Добавить</button>

  <h3>Набор 2</h3>
  <table id="table2">
    <tr>
      <th>h</th>
      <th>b₁</th>
      <th>b₂</th>
    </tr>
  </table>
  <button onclick="addTrapezoid(1)">Добавить</button>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scale = 3; // масштаб координат → пиксели
const origin = { x: canvas.width / 2, y: canvas.height - 50 };

const sets = [
  { color: "#007bff", traps: [] },
  { color: "#28a745", traps: [] }
];

let selected = null;

function addTrapezoid(setIndex) {
  sets[setIndex].traps.push({ h: 50, b1: 120, b2: 80 });
  rebuildTables();
  draw();
}

function rebuildTables() {
  [table1, table2].forEach((table, si) => {
    table.innerHTML = `
      <tr><th>h</th><th>b₁</th><th>b₂</th></tr>
    `;
    sets[si].traps.forEach((t, ti) => {
      const row = table.insertRow();
      if (selected && selected.set === si && selected.idx === ti) {
        row.classList.add("selected");
      }
      row.onclick = () => {
        selected = { set: si, idx: ti };
        rebuildTables();
        draw();
      };
      ["h", "b1", "b2"].forEach(k => {
        const cell = row.insertCell();
        const input = document.createElement("input");
        input.type = "number";
        input.value = t[k];
        input.style.width = "60px";
        input.oninput = () => {
          t[k] = +input.value;
          draw();
        };
        cell.appendChild(input);
      });
    });
  });
}

function drawAxes() {
  ctx.strokeStyle = "#999";
  ctx.lineWidth = 1;

  // X
  ctx.beginPath();
  ctx.moveTo(0, origin.y);
  ctx.lineTo(canvas.width, origin.y);
  ctx.stroke();

  // Y
  ctx.beginPath();
  ctx.moveTo(origin.x, 0);
  ctx.lineTo(origin.x, canvas.height);
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawAxes();

  sets.forEach((set, si) => {
    let yOffset = 0;
    set.traps.forEach((t, ti) => {
      const isSelected =
        selected && selected.set === si && selected.idx === ti;

      drawTrapezoid(
        t.b1,
        t.b2,
        t.h,
        yOffset,
        isSelected ? "red" : set.color,
        isSelected ? 3 : 1.5
      );
      yOffset += t.h;
    });
  });
}

function drawTrapezoid(b1, b2, h, yOffset, color, width) {
  const y0 = origin.y - yOffset * scale;
  const y1 = y0 - h * scale;

  const halfB1 = (b1 * scale) / 2;
  const halfB2 = (b2 * scale) / 2;

  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(origin.x - halfB1, y0);
  ctx.lineTo(origin.x + halfB1, y0);
  ctx.lineTo(origin.x + halfB2, y1);
  ctx.lineTo(origin.x - halfB2, y1);
  ctx.closePath();
  ctx.stroke();
}

addTrapezoid(0);
addTrapezoid(1);
</script>

</body>
</html>
