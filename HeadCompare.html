<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Trapezoids Tool</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  display: flex;
  height: 100vh;
}
canvas {
  background: #fff;
}
.panel {
  width: 500px;
  padding: 10px;
  border-left: 1px solid #ccc;
  overflow-y: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 6px;
}
th, td {
  border: 1px solid #ccc;
  padding: 3px;
  text-align: center;
}
tr.selected {
  background: #ffeeba;
}
button {
  width: 100%;
  margin: 4px 0;
}
input[type="number"] {
  width: 55px;
}
.row-btn {
  width: 26px;
}
</style>
</head>
<body>

<canvas id="canvas" width="900" height="600"></canvas>

<div class="panel">
  <button onclick="exportSVG()">Экспорт SVG</button>
  <button onclick="exportDXF()">Экспорт DXF</button>
  <button onclick="toggleDiff()">Разница контуров</button>

  <h3>Набор 1</h3>
  Цвет <input type="color" id="color1" value="#007bff">
  Прозрачность <input type="range" min="0.05" max="1" step="0.05" value="0.5" id="alpha1">
  <table id="table1">
    <tr><th>h</th><th>b₁</th><th>b₂</th><th>+</th><th>✕</th></tr>
  </table>
  <button onclick="addBottom(0)">Добавить снизу</button>

  <h3>Набор 2</h3>
  Цвет <input type="color" id="color2" value="#28a745">
  Прозрачность <input type="range" min="0.05" max="1" step="0.05" value="0.5" id="alpha2">
  <table id="table2">
    <tr><th>h</th><th>b₁</th><th>b₂</th><th>+</th><th>✕</th></tr>
  </table>
  <button onclick="addBottom(1)">Добавить снизу</button>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let scale = 3;
let origin = { x: canvas.width / 2, y: canvas.height - 50 };
let dragging = false;
let lastMouse = null;
let showDiff = false;
let selected = null;

const sets = [
  { color:"#007bff", alpha:0.5, traps:[] },
  { color:"#28a745", alpha:0.5, traps:[] }
];

/* ---------- Цвет / прозрачность ---------- */

function updateColor(i){
  sets[i].color = document.getElementById("color"+(i+1)).value;
  sets[i].alpha = +document.getElementById("alpha"+(i+1)).value;
  draw();
}
color1.oninput = ()=>updateColor(0);
alpha1.oninput = ()=>updateColor(0);
color2.oninput = ()=>updateColor(1);
alpha2.oninput = ()=>updateColor(1);

/* ---------- Масштаб / перемещение ---------- */

canvas.addEventListener("wheel", e=>{
  e.preventDefault();
  scale *= e.deltaY<0 ? 1.1 : 0.9;
  draw();
},{passive:false});

canvas.addEventListener("mousedown", e=>{
  if(e.button!==1) return;
  dragging=true;
  lastMouse={x:e.clientX,y:e.clientY};
});
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("mousemove",e=>{
  if(!dragging) return;
  origin.x+=e.clientX-lastMouse.x;
  origin.y+=e.clientY-lastMouse.y;
  lastMouse={x:e.clientX,y:e.clientY};
  draw();
});

/* ---------- Данные ---------- */

function addBottom(si){
  sets[si].traps.push({h:50,b1:120,b2:80});
  rebuild();
}
function addTop(si,idx){
  sets[si].traps.splice(idx+1,0,{h:50,b1:120,b2:80});
  rebuild();
}
function removeRow(si,idx){
  sets[si].traps.splice(idx,1);
  selected=null;
  rebuild();
}

function rebuild(){
  [table1,table2].forEach((table,si)=>{
    table.innerHTML=`<tr><th>h</th><th>b₁</th><th>b₂</th><th>+</th><th>✕</th></tr>`;
    [...sets[si].traps].reverse().forEach((t,ri)=>{
      const idx=sets[si].traps.length-1-ri;
      const row=table.insertRow();
      if(selected&&selected.set===si&&selected.idx===idx) row.classList.add("selected");

      row.onclick=e=>{
        if(e.target.tagName==="INPUT"||e.target.tagName==="BUTTON") return;
        selected={set:si,idx};
        rebuild(); draw();
      };

      ["h","b1","b2"].forEach(k=>{
        const c=row.insertCell();
        const i=document.createElement("input");
        i.type="number"; i.value=t[k];
        i.onmousedown=i.onclick=i.onfocus=e=>e.stopPropagation();
        i.oninput=()=>{t[k]=+i.value; draw();};
        c.appendChild(i);
      });

      const add=row.insertCell();
      const del=row.insertCell();

      const bAdd=document.createElement("button");
      bAdd.textContent="+";
      bAdd.className="row-btn";
      bAdd.onclick=e=>{e.stopPropagation();addTop(si,idx);};
      add.appendChild(bAdd);

      const bDel=document.createElement("button");
      bDel.textContent="✕";
      bDel.className="row-btn";
      bDel.onclick=e=>{e.stopPropagation();removeRow(si,idx);};
      del.appendChild(bDel);
    });
  });
  draw();
}

/* ---------- Отрисовка ---------- */

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  sets.forEach((s,si)=>{
    let y=0;
    s.traps.forEach((t,ti)=>{
      const hi=selected&&selected.set===si&&selected.idx===ti;
      drawTrap(t,y,hi?"rgba(255,0,0,0.9)":rgba(s),hi?2:1);
      y+=t.h;
    });
  });
  if(showDiff) drawDiff();
}

function drawTrap(t,y,color,w){
  const y0=origin.y-y*scale;
  const y1=y0-t.h*scale;
  const a=t.b1*scale/2,b=t.b2*scale/2;
  ctx.strokeStyle=color;
  ctx.lineWidth=w;
  ctx.beginPath();
  ctx.moveTo(origin.x-a,y0);
  ctx.lineTo(origin.x+a,y0);
  ctx.lineTo(origin.x+b,y1);
  ctx.lineTo(origin.x-b,y1);
  ctx.closePath();
  ctx.stroke();
}

function rgba(s){
  const r=parseInt(s.color.substr(1,2),16);
  const g=parseInt(s.color.substr(3,2),16);
  const b=parseInt(s.color.substr(5,2),16);
  return `rgba(${r},${g},${b},${s.alpha})`;
}

/* ---------- Diff ---------- */

function toggleDiff(){showDiff=!showDiff;draw();}
function drawDiff(){
  if(!sets[0].traps.length||!sets[1].traps.length) return;
  ctx.strokeStyle="rgba(255,0,0,0.4)";
  ctx.lineWidth=3;
  const a=outline(sets[0]),b=outline(sets[1]).reverse();
  ctx.beginPath();
  a.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  b.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.closePath(); ctx.stroke();
}
function outline(s){
  let y=0,pts=[];
  s.traps.forEach(t=>{
    pts.push({x:origin.x-t.b1*scale/2,y:origin.y-y*scale});
    y+=t.h;
  });
  return pts;
}

/* ---------- Экспорт ---------- */

function exportSVG(){
  let svg=`<svg xmlns="http://www.w3.org/2000/svg">\n`;
  sets.forEach(s=>{
    let y=0;
    s.traps.forEach(t=>{
      svg+=`<polygon points="
      ${-t.b1/2},${y}
      ${ t.b1/2},${y}
      ${ t.b2/2},${y+t.h}
      ${-t.b2/2},${y+t.h}"
      fill="none" stroke="${s.color}" stroke-opacity="${s.alpha}"/>\n`;
      y+=t.h;
    });
  });
  svg+="</svg>";
  download("trapezoids.svg",svg);
}

function exportDXF(){
  let dxf=`0\nSECTION\n2\nENTITIES\n`;
  sets.forEach(s=>{
    let y=0;
    s.traps.forEach(t=>{
      const p=[[-t.b1/2,y],[t.b1/2,y],[t.b2/2,y+t.h],[-t.b2/2,y+t.h],[-t.b1/2,y]];
      dxf+="0\nLWPOLYLINE\n90\n5\n";
      p.forEach(v=>dxf+=`10\n${v[0]}\n20\n${v[1]}\n`);
      y+=t.h;
    });
  });
  dxf+="0\nENDSEC\n0\nEOF";
  download("trapezoids.dxf",dxf);
}

function download(n,d){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([d]));
  a.download=n; a.click();
}

/* ---------- Init ---------- */

addBottom(0);
addBottom(1);
</script>
</body>
</html>
