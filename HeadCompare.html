<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Trapezoids Tool - Auto Simplify</title>
<style>
body { margin:0; font-family:Arial; display:flex; height:100vh; }
canvas { background:#fff; }
.panel { width:520px; padding:10px; border-left:1px solid #ccc; overflow-y:auto; }
table { width:100%; border-collapse:collapse; margin-bottom:6px; }
th,td { border:1px solid #ccc; padding:3px; text-align:center; }
tr.selected { background:#ffeeba; }
input[type=number]{ width:55px; }
button{ width:100%; margin:4px 0; }
.row-btn{ width:26px; }
</style>
</head>
<body>

<canvas id="canvas" width="900" height="600"></canvas>

<div class="panel">
  <button onclick="exportSVG()">Экспорт SVG</button>
  <button onclick="exportDXF()">Экспорт DXF</button>
  <button onclick="toggleDiff()">Разница контуров</button>

  <h3>Набор 1</h3>
  Цвет <input type="color" id="color1" value="#007bff">
  Прозрачность <input type="range" min="0.05" max="1" step="0.05" value="0.5" id="alpha1">
  <button onclick="exportParams(0)">Экспорт параметров</button>
  <button onclick="importParams(0)">Импорт параметров</button>
  <button onclick="autoSimplifySet(0)">Авто-упрощение до 15</button>
  <table id="table1">
    <tr><th>№</th><th>h</th><th>b₁</th><th>b₂</th><th>+</th><th>✕</th></tr>
  </table>
  <button onclick="addBottom(0)">Добавить снизу</button>

  <h3>Набор 2</h3>
  Цвет <input type="color" id="color2" value="#28a745">
  Прозрачность <input type="range" min="0.05" max="1" step="0.05" value="0.5" id="alpha2">
  <button onclick="exportParams(1)">Экспорт параметров</button>
  <button onclick="importParams(1)">Импорт параметров</button>
  <button onclick="autoSimplifySet(1)">Авто-упрощение до 15</button>
  <table id="table2">
    <tr><th>№</th><th>h</th><th>b₁</th><th>b₂</th><th>+</th><th>✕</th></tr>
  </table>
  <button onclick="addBottom(1)">Добавить снизу</button>
</div>

<script>
const canvas=document.getElementById("canvas"), ctx=canvas.getContext("2d");
let scale=3, origin={x:canvas.width/2, y:canvas.height-50}, dragging=false, lastMouse=null, showDiff=false, selected=null;
const sets=[{color:"#007bff", alpha:0.5, traps:[]},{color:"#28a745", alpha:0.5, traps:[]}];
const simplifiedSets=[null,null]; // сюда сохраняем оптимизированные контуры

// ---------- Цвет ----------
function updateColor(i){
  sets[i].color=document.getElementById("color"+(i+1)).value;
  sets[i].alpha=+document.getElementById("alpha"+(i+1)).value;
  draw();
}
color1.oninput=()=>updateColor(0); alpha1.oninput=()=>updateColor(0);
color2.oninput=()=>updateColor(1); alpha2.oninput=()=>updateColor(1);

// ---------- Масштаб / перенос ----------
canvas.addEventListener("wheel", e=>{ e.preventDefault(); scale*=(e.deltaY<0?1.1:0.9); draw(); },{passive:false});
canvas.addEventListener("mousedown", e=>{ if(e.button!==1) return; dragging=true; lastMouse={x:e.clientX,y:e.clientY}; });
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("mousemove", e=>{ if(!dragging) return; origin.x+=e.clientX-lastMouse.x; origin.y+=e.clientY-lastMouse.y; lastMouse={x:e.clientX,y:e.clientY}; draw(); });

// ---------- Таблицы ----------
function addBottom(si){ sets[si].traps.push({h:50,b1:120,b2:80}); rebuild(); }
function addCopyAbove(si, idx){ const src=sets[si].traps[idx]; sets[si].traps.splice(idx+1,0,{...src}); rebuild(); }
function removeRow(si, idx){ sets[si].traps.splice(idx,1); selected=null; rebuild(); }

function rebuild(){
  [table1,table2].forEach((table,si)=>{
    table.innerHTML=`<tr><th>№</th><th>h</th><th>b₁</th><th>b₂</th><th>+</th><th>✕</th></tr>`;
    const n=sets[si].traps.length;
    [...sets[si].traps].reverse().forEach((t,ri)=>{
      const idx=n-1-ri;
      const row=table.insertRow();
      if(selected&&selected.set===si&&selected.idx===idx) row.classList.add("selected");

      row.onclick=e=>{ if(e.target.tagName==="INPUT"||e.target.tagName==="BUTTON") return; selected={set:si,idx}; rebuild(); draw(); };

      row.insertCell().textContent=idx+1;

      ["h","b1","b2"].forEach(k=>{
        const c=row.insertCell();
        const i=document.createElement("input"); i.type="number"; i.value=t[k];
        i.onmousedown=i.onclick=i.onfocus=e=>e.stopPropagation();
        i.oninput=()=>{ t[k]=+i.value; draw(); };
        c.appendChild(i);
      });

      const add=row.insertCell(), del=row.insertCell();
      const bAdd=document.createElement("button"); bAdd.textContent="+"; bAdd.className="row-btn"; bAdd.onclick=e=>{ e.stopPropagation(); addCopyAbove(si,idx); }; add.appendChild(bAdd);
      const bDel=document.createElement("button"); bDel.textContent="✕"; bDel.className="row-btn"; bDel.onclick=e=>{ e.stopPropagation(); removeRow(si,idx); }; del.appendChild(bDel);
    });
  });
  draw();
}

// ---------- Отрисовка ----------
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  sets.forEach((s,si)=>{
    let y=0;
    s.traps.forEach((t,ti)=>{
      drawTrap(t,y, selected&&selected.set===si&&selected.idx===ti?"rgba(255,0,0,0.9)":rgba(s), selected&&selected.set===si&&selected.idx===ti?2:1);
      y+=t.h;
    });
  });
  // рисуем оптимизированный контур красным
  simplifiedSets.forEach((simp,i)=>{
    if(!simp) return;
    let y=0;
    ctx.strokeStyle="red"; ctx.lineWidth=2;
    ctx.beginPath();
    simp.forEach(tr=>{
      const y0=origin.y-y*scale;
      const y1=y0-tr.h*scale;
      const a=tr.b1*scale/2, b=tr.b2*scale/2;
      ctx.moveTo(origin.x-a,y0);
      ctx.lineTo(origin.x+a,y0);
      ctx.lineTo(origin.x+b,y1);
      ctx.lineTo(origin.x-b,y1);
      ctx.closePath();
      y+=tr.h;
    });
    ctx.stroke();
  });
  if(showDiff) drawDiff();
}

function drawTrap(t,y,color,w){
  const y0=origin.y-y*scale, y1=y0-t.h*scale, a=t.b1*scale/2, b=t.b2*scale/2;
  ctx.strokeStyle=color; ctx.lineWidth=w;
  ctx.beginPath();
  ctx.moveTo(origin.x-a,y0); ctx.lineTo(origin.x+a,y0); ctx.lineTo(origin.x+b,y1); ctx.lineTo(origin.x-b,y1); ctx.closePath(); ctx.stroke();
}

function rgba(s){ const r=parseInt(s.color.substr(1,2),16), g=parseInt(s.color.substr(3,2),16), b=parseInt(s.color.substr(5,2),16); return `rgba(${r},${g},${b},${s.alpha})`; }

// ---------- Diff ----------
function toggleDiff(){showDiff=!showDiff; draw();}
function drawDiff(){ /* аналогично предыдущей реализации */ }

// ---------- Импорт / Экспорт ----------
function exportParams(si){ download(`params_set${si+1}.json`, JSON.stringify(sets[si].traps,null,2)); }
function importParams(si){ const i=document.createElement("input"); i.type="file"; i.accept=".json"; i.onchange=()=>{ const r=new FileReader(); r.onload=()=>{ try{ const data=JSON.parse(r.result); if(Array.isArray(data)) sets[si].traps=data; rebuild(); }catch{alert("Ошибка файла"); } }; r.readAsText(i.files[0]); }; i.click(); }
function exportSVG(){ /* оставляем твою текущую реализацию */ }
function exportDXF(){ /* оставляем твою текущую реализацию */ }
function download(n,d){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([d])); a.download=n; a.click(); }

// ---------- Авто-упрощение ----------
function autoSimplifySet(si){
  simplifiedSets[si] = optimizeTrapezoids(sets[si].traps, 15);
  draw();
}

// ---------- Оптимизация трапеций ----------
function optimizeTrapezoids(traps,maxCount=15){
  if(traps.length<=maxCount) return [...traps];
  let yAcc=0;
  const segments=[];
  for(const t of traps){ segments.push({y0:yAcc,y1:yAcc+t.h,b1:t.b1,b2:t.b2}); yAcc+=t.h; }

  const n=segments.length;
  const dp=Array.from({length:n+1},()=>Array(maxCount+1).fill(Infinity));
  const back=Array.from({length:n+1},()=>Array(maxCount+1).fill(-1));
  dp[0][0]=0;

  function excessArea(segStart,segEnd){
    let hTotal=0,b1Max=0,b2Max=0;
    for(let i=segStart;i<segEnd;i++){ const s=segments[i]; hTotal+=s.y1-s.y0; b1Max=Math.max(b1Max,s.b1); b2Max=Math.max(b2Max,s.b2);}
    let areaNew=hTotal*( (b1Max+b2Max)/2 );
    let areaOld=0; for(let i=segStart;i<segEnd;i++){ const s=segments[i]; areaOld+=(s.y1-s.y0)*( (s.b1+s.b2)/2 ); }
    return areaNew-areaOld;
  }

  for(let i=1;i<=n;i++){ for(let k=1;k<=maxCount;k++){ for(let j=0;j<i;j++){
    const cost=dp[j][k-1]+excessArea(j,i); if(cost<dp[i][k]){ dp[i][k]=cost; back[i][k]=j; }}}}

  let k=maxCount,i=n,blocks=[];
  while(i>0 && k>0){ const j=back[i][k]; blocks.push([j,i]); i=j; k--; }
  blocks.reverse();

  const result=[];
  for(const [start,end] of blocks){
    let hTotal=0,b1Max=0,b2Max=0;
    for(let idx=start;idx<end;idx++){ const s=segments[idx]; hTotal+=s.y1-s.y0; b1Max=Math.max(b1Max,s.b1); b2Max=Math.max(b2Max,s.b2); }
    result.push({h:hTotal,b1:b1Max,b2:b2Max});
  }
  return result;
}

// ---------- Init ----------
addBottom(0); addBottom(1);
</script>
</body>
</html>
