<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Trapezoids Tool</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  display: flex;
  height: 100vh;
}
canvas {
  background: #fff;
  cursor: default;
}
canvas.dragging {
  cursor: grabbing;
}
.panel {
  width: 460px;
  padding: 10px;
  border-left: 1px solid #ccc;
  overflow-y: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 6px;
}
th, td {
  border: 1px solid #ccc;
  padding: 4px;
  text-align: center;
}
tr.selected {
  background: #ffeeba;
}
button, input[type="color"] {
  width: 100%;
  margin: 4px 0;
}
</style>
</head>
<body>

<canvas id="canvas" width="900" height="600"></canvas>

<div class="panel">
  <button onclick="exportSVG()">Экспорт SVG</button>
  <button onclick="exportDXF()">Экспорт DXF</button>
  <button onclick="toggleDiff()">Разница контуров</button>

  <h3>Набор 1</h3>
  <input type="color" id="color1" value="#007bff">
  <table id="table1">
    <tr><th>h</th><th>b₁</th><th>b₂</th></tr>
  </table>
  <button onclick="addTrapezoid(0)">Добавить</button>

  <h3>Набор 2</h3>
  <input type="color" id="color2" value="#28a745">
  <table id="table2">
    <tr><th>h</th><th>b₁</th><th>b₂</th></tr>
  </table>
  <button onclick="addTrapezoid(1)">Добавить</button>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let scale = 3;
let origin = { x: canvas.width / 2, y: canvas.height - 50 };
let dragging = false;
let lastMouse = null;
let showDiff = false;

const sets = [
  { color: "rgba(0,123,255,0.5)", traps: [] },
  { color: "rgba(40,167,69,0.5)", traps: [] }
];

let selected = null;

/* ---------- UI ---------- */

color1.oninput = e => {
  sets[0].color = hexToRgba(e.target.value, 0.5);
  draw();
};
color2.oninput = e => {
  sets[1].color = hexToRgba(e.target.value, 0.5);
  draw();
};

/* ---------- Mouse ---------- */

// масштабирование колесом
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  scale *= e.deltaY < 0 ? 1.1 : 0.9;
  draw();
}, { passive: false });

// перемещение начала координат — СКМ
canvas.addEventListener("mousedown", e => {
  if (e.button !== 1) return;
  dragging = true;
  canvas.classList.add("dragging");
  lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener("mouseup", () => {
  dragging = false;
  canvas.classList.remove("dragging");
});

window.addEventListener("mousemove", e => {
  if (!dragging) return;
  origin.x += e.clientX - lastMouse.x;
  origin.y += e.clientY - lastMouse.y;
  lastMouse = { x: e.clientX, y: e.clientY };
  draw();
});

/* ---------- Data ---------- */

function addTrapezoid(si) {
  sets[si].traps.push({ h: 50, b1: 120, b2: 80 });
  rebuildTables();
  draw();
}

function rebuildTables() {
  [table1, table2].forEach((table, si) => {
    table.innerHTML = `<tr><th>h</th><th>b₁</th><th>b₂</th></tr>`;

    [...sets[si].traps].reverse().forEach((t, ri) => {
      const ti = sets[si].traps.length - 1 - ri;
      const row = table.insertRow();

      if (selected && selected.set === si && selected.idx === ti)
        row.classList.add("selected");

      row.onclick = () => {
        selected = { set: si, idx: ti };
        rebuildTables();
        draw();
      };

      ["h", "b1", "b2"].forEach(k => {
        const cell = row.insertCell();
        const input = document.createElement("input");
        input.type = "number";
        input.value = t[k];
        input.style.width = "60px";

        // фикс фокуса
        input.onmousedown = e => e.stopPropagation();

        input.oninput = () => {
          t[k] = +input.value;
          draw();
        };

        cell.appendChild(input);
      });
    });
  });
}

/* ---------- Drawing ---------- */

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  sets.forEach((set, si) => {
    let y = 0;
    set.traps.forEach((t, ti) => {
      const highlight =
        selected && selected.set === si && selected.idx === ti;

      drawTrapezoid(
        t, y,
        highlight ? "rgba(255,0,0,0.9)" : set.color,
        highlight ? 2 : 1
      );
      y += t.h;
    });
  });

  if (showDiff) drawDiff();
}

function drawTrapezoid(t, yOffset, color, width) {
  const y0 = origin.y - yOffset * scale;
  const y1 = y0 - t.h * scale;
  const hb1 = t.b1 * scale / 2;
  const hb2 = t.b2 * scale / 2;

  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(origin.x - hb1, y0);
  ctx.lineTo(origin.x + hb1, y0);
  ctx.lineTo(origin.x + hb2, y1);
  ctx.lineTo(origin.x - hb2, y1);
  ctx.closePath();
  ctx.stroke();
}

/* ---------- Diff ---------- */

function toggleDiff() {
  showDiff = !showDiff;
  draw();
}

function drawDiff() {
  if (!sets[0].traps.length || !sets[1].traps.length) return;

  ctx.strokeStyle = "rgba(255,0,0,0.4)";
  ctx.lineWidth = 3;

  const a = outline(sets[0]);
  const b = outline(sets[1]).reverse();

  ctx.beginPath();
  a.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  b.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.closePath();
  ctx.stroke();
}

function outline(set) {
  let y = 0;
  const pts = [];
  set.traps.forEach(t => {
    pts.push({
      x: origin.x - t.b1 * scale / 2,
      y: origin.y - y * scale
    });
    y += t.h;
  });
  return pts;
}

/* ---------- Export ---------- */

function exportSVG() {
  let svg = `<svg xmlns="http://www.w3.org/2000/svg">\n`;
  sets.forEach(set => {
    let y = 0;
    set.traps.forEach(t => {
      const p = [
        [-t.b1/2, y],
        [ t.b1/2, y],
        [ t.b2/2, y+t.h],
        [-t.b2/2, y+t.h]
      ];
      svg += `<polygon points="${p.map(v=>v.join(",")).join(" ")}"
        fill="none" stroke="${set.color}"/>\n`;
      y += t.h;
    });
  });
  svg += "</svg>";
  download("trapezoids.svg", svg);
}

function exportDXF() {
  let dxf = `0\nSECTION\n2\nENTITIES\n`;
  sets.forEach(set => {
    let y = 0;
    set.traps.forEach(t => {
      const pts = [
        [-t.b1/2, y],
        [ t.b1/2, y],
        [ t.b2/2, y+t.h],
        [-t.b2/2, y+t.h],
        [-t.b1/2, y]
      ];
      dxf += "0\nLWPOLYLINE\n8\n0\n90\n5\n";
      pts.forEach(p => {
        dxf += `10\n${p[0]}\n20\n${p[1]}\n`;
      });
      y += t.h;
    });
  });
  dxf += "0\nENDSEC\n0\nEOF";
  download("trapezoids.dxf", dxf);
}

function download(name, data) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data]));
  a.download = name;
  a.click();
}

/* ---------- Utils ---------- */

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ---------- Init ---------- */

addTrapezoid(0);
addTrapezoid(1);
draw();
</script>

</body>
</html>
