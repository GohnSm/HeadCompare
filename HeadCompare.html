<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>HeadCompare</title>
<style>
body { margin:0; font-family:Arial; display:flex; height:100vh; }
canvas { background:#fff; flex:1; }
.panel { width:600px; padding:10px; border-left:1px solid #ccc; overflow-y:auto; }
table { width:100%; border-collapse:collapse; margin-bottom:6px; }
th,td { border:1px solid #ccc; padding:3px; text-align:center; }
tr.selected { background:#ffeeba; }
input[type=number]{ width:55px; }
input.nameInput{ width:140px; font-weight:bold; }
button{ width:100%; margin:4px 0; }
.row-btn{ width:26px; }
</style>
</head>
<body>

<canvas id="canvas" width="900" height="600"></canvas>

<div class="panel">
  <button onclick="exportSVG()">Экспорт SVG</button>
  <button onclick="exportDXF()">Экспорт DXF</button>
  <button onclick="toggleDiff()">Разница контуров</button>
  <button onclick="addHead()">Добавить голову</button>
  <div id="headsContainer"></div>
</div>

<script>
const canvas=document.getElementById("canvas"), ctx=canvas.getContext("2d");
let scale=3, origin={x:canvas.width/2, y:canvas.height-50}, dragging=false, lastMouse=null, selected=null;
const heads=[], simplifiedHeads=[];

// ---------- Инициализация стартовых голов ----------
function initHeads(){
  addHead("Голова 1","#007bff",0.5);
  addHead("Голова 2","#28a745",0.5);
}
initHeads();

// ---------- Добавление новой головы ----------
function addHead(name="Новая голова",color="#0000ff",alpha=0.5,traps=null){
  const head={name,color,alpha,traps:traps?traps.map(t=>({...t})):[]};
  heads.push(head);
  simplifiedHeads.push(null);
  renderHeadsPanel();
}

// ---------- Панель голов ----------
function renderHeadsPanel(){
  const container=document.getElementById("headsContainer");
  container.innerHTML="";
  heads.forEach((head,hi)=>{
    const div=document.createElement("div");
    div.style.border="1px solid #aaa"; div.style.padding="5px"; div.style.marginBottom="6px";

    // Имя головы
    const h3=document.createElement("div");
    const nameInput=document.createElement("input");
    nameInput.value=head.name; nameInput.className="nameInput";
    nameInput.oninput=()=>{ head.name=nameInput.value; draw(); };
    h3.appendChild(nameInput); div.appendChild(h3);

    // Цвет и прозрачность
    const colorInput=document.createElement("input"); colorInput.type="color"; colorInput.value=head.color;
    colorInput.oninput=()=>{ head.color=colorInput.value; draw(); }; div.appendChild(document.createTextNode(" Цвет ")); div.appendChild(colorInput);
    const alphaInput=document.createElement("input"); alphaInput.type="range"; alphaInput.min=0.05; alphaInput.max=1; alphaInput.step=0.05; alphaInput.value=head.alpha;
    alphaInput.oninput=()=>{ head.alpha=+alphaInput.value; draw(); }; div.appendChild(document.createTextNode(" Прозрачность ")); div.appendChild(alphaInput);

    div.appendChild(document.createElement("br"));

    // Экспорт/импорт
    const btnExport=document.createElement("button"); btnExport.textContent="Экспорт параметров"; btnExport.onclick=()=>exportParams(hi); div.appendChild(btnExport);
    const btnImport=document.createElement("button"); btnImport.textContent="Импорт параметров"; btnImport.onclick=()=>importParams(hi); div.appendChild(btnImport);

    // Авто-упрощение
    const btnAuto=document.createElement("button"); btnAuto.textContent="Авто-упрощение до 15"; 
    btnAuto.onclick=()=>{ 
      const simplified=optimizeTrapezoids(head.traps,15);
      addHead(head.name+"-упрощённая",head.color,head.alpha,simplified);
      simplifiedHeads[heads.length-1]=simplified; draw();
    };
    div.appendChild(btnAuto);

    // Удаление головы
    const btnDelHead=document.createElement("button"); btnDelHead.textContent="Удалить голову";
    btnDelHead.onclick=()=>{ if(confirm("Удалить эту голову?")) { heads.splice(hi,1); simplifiedHeads.splice(hi,1); renderHeadsPanel(); } };
    div.appendChild(btnDelHead);

    // Таблица
    const table=document.createElement("table"); table.id="table"+hi; table.innerHTML="<tr><th>№</th><th>b₁</th><th>b₂</th><th>h</th><th>+</th><th>✕</th></tr>"; div.appendChild(table);
    const btnAddRow=document.createElement("button"); btnAddRow.textContent="Добавить снизу"; btnAddRow.onclick=()=>{ head.traps.push({h:50,b1:120,b2:80}); rebuild(); }; div.appendChild(btnAddRow);

    container.appendChild(div);
  });
  rebuild();
}

// ---------- Таблица ----------
function rebuild(){
  heads.forEach((head,hi)=>{
    const table=document.getElementById("table"+hi);
    if(!table) return;
    table.innerHTML="<tr><th>№</th><th>b₁</th><th>b₂</th><th>h</th><th>+</th><th>✕</th></tr>";
    const n=head.traps.length;
    [...head.traps].reverse().forEach((t,ri)=>{
      const idx=n-1-ri;
      const row=table.insertRow();
      if(selected&&selected.head===hi&&selected.idx===idx) row.classList.add("selected");
      row.insertCell().textContent=idx+1;

      ["b1","b2","h"].forEach((k,j)=>{
        const c=row.insertCell();
        const input=document.createElement("input"); input.type="number"; input.value=t[k];
        input.onmousedown=input.onclick=input.onfocus=e=>{ e.stopPropagation(); toggleSelect(hi,idx,true); input.select(); updateSimplified(hi); };
        input.onkeydown=e=>handleArrowKeys(e,hi,idx,j);
        input.oninput=()=>{ t[k]=+input.value; updateSimplified(hi); draw(); };
        c.appendChild(input);
      });

      const add=row.insertCell(), del=row.insertCell();
      const bAdd=document.createElement("button"); bAdd.textContent="+"; bAdd.onclick=e=>{ e.stopPropagation(); head.traps.splice(idx+1,0,{...t}); rebuild(); updateSimplified(hi); }; add.appendChild(bAdd);
      const bDel=document.createElement("button"); bDel.textContent="✕"; bDel.onclick=e=>{ e.stopPropagation(); head.traps.splice(idx,1); rebuild(); updateSimplified(hi); }; del.appendChild(bDel);

      // Drag & drop с исключением input/button
      row.draggable=true;
      row.ondragstart=e=>{
        if(e.target.tagName==="INPUT" || e.target.tagName==="BUTTON") { e.preventDefault(); return; }
        e.dataTransfer.setData("text/plain", idx+","+hi); 
        row.classList.add("dragging"); 
      };
      row.ondragend=e=>row.classList.remove("dragging");
      row.ondragover=e=>e.preventDefault();
      row.ondrop=e=>{
        e.preventDefault();
        const [fromIdx,fromHi]=e.dataTransfer.getData("text/plain").split(",").map(Number);
        if(fromHi!==hi) return;
        const moved=head.traps.splice(fromIdx,1)[0];
        const dropIdx=idx<fromIdx?idx:idx+1;
        head.traps.splice(dropIdx,0,moved);
        rebuild(); updateSimplified(hi);
      };
    });
  });
  draw();
}

// ---------- Выделение ----------
function toggleSelect(headIdx,idx,force=false){
  if(selected && selected.head===headIdx && selected.idx===idx && !force) selected=null;
  else selected={head:headIdx,idx};
  rebuild();
}

// ---------- Навигация стрелками ----------
function handleArrowKeys(e,hi,idx,col){
  const fields=["b1","b2","h"];
  if(e.key==="ArrowUp"){ e.preventDefault(); selectInput(hi,idx-1,col); }
  if(e.key==="ArrowDown"){ e.preventDefault(); selectInput(hi,idx+1,col); }
  if(e.key==="ArrowLeft" && col>0){ e.preventDefault(); selectInput(hi,idx,col-1); }
  if(e.key==="ArrowRight" && col<fields.length-1){ e.preventDefault(); selectInput(hi,idx,col+1); }
}
function selectInput(hi,idx,col){
  if(idx<0 || idx>=heads[hi].traps.length) return;
  const table=document.getElementById("table"+hi);
  const row=table.rows[heads[hi].traps.length-idx];
  const input=row.cells[col+1].firstChild;
  input.focus(); input.select(); toggleSelect(hi,idx,true);
}

// ---------- Canvas ----------
canvas.addEventListener("wheel", e=>{ e.preventDefault(); scale*=(e.deltaY<0?1.1:0.9); draw(); },{passive:false});
canvas.addEventListener("mousedown", e=>{ if(e.button!==1) return; dragging=true; lastMouse={x:e.clientX,y:e.clientY}; });
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("mousemove", e=>{ if(!dragging) return; origin.x+=e.clientX-lastMouse.x; origin.y+=e.clientY-lastMouse.y; lastMouse={x:e.clientX,y:e.clientY}; draw(); });

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  heads.forEach((head,hi)=>{
    let y=0;
    head.traps.forEach((t,ti)=>{
      drawTrap(t,y,selected&&selected.head===hi&&selected.idx===ti?"rgba(255,0,0,0.9)":rgba(head),selected&&selected.head===hi&&selected.idx===ti?2:1,hi,ti);
      y+=t.h;
    });
  });

  simplifiedHeads.forEach((simp,hi)=>{
    if(!simp) return;
    let y=0;
    ctx.strokeStyle="red"; ctx.lineWidth=2;
    ctx.beginPath();
    simp.forEach(tr=>{
      const y0=origin.y-y*scale; const y1=y0-tr.h*scale; const a=tr.b1*scale/2, b=tr.b2*scale/2;
      ctx.moveTo(origin.x-a,y0); ctx.lineTo(origin.x+a,y0); ctx.lineTo(origin.x+b,y1); ctx.lineTo(origin.x-b,y1); ctx.closePath();
      y+=tr.h;
    });
    ctx.stroke();
  });
}

function drawTrap(t,y,color,w,hi,ti){
  const y0=origin.y-y*scale, y1=y0-t.h*scale;
  const a=t.b1*scale/2, b=t.b2*scale/2;
  ctx.strokeStyle=color; ctx.lineWidth=w;
  ctx.beginPath();
  ctx.moveTo(origin.x-a,y0); ctx.lineTo(origin.x+a,y0); ctx.lineTo(origin.x+b,y1); ctx.lineTo(origin.x-b,y1); ctx.closePath(); ctx.stroke();
  if(selected && selected.head===hi && selected.idx===ti){
    ctx.fillStyle="black"; ctx.font="14px Arial";
    ctx.fillText(`h:${t.h}`, origin.x+b+5, y1+(y0-y1)/2);
    ctx.fillText(`b1:${t.b1}`, origin.x-a-40, y0-2);
    ctx.fillText(`b2:${t.b2}`, origin.x-b-40, y1-2);
  }
}

function rgba(head){ const r=parseInt(head.color.substr(1,2),16), g=parseInt(head.color.substr(3,2),16), b=parseInt(head.color.substr(5,2),16); return `rgba(${r},${g},${b},${head.alpha})`; }

// ---------- Импорт/Экспорт ----------
function exportParams(hi){ download(heads[hi].name+".json", JSON.stringify(heads[hi].traps,null,2)); }
function importParams(hi){ const i=document.createElement("input"); i.type="file"; i.accept=".json"; i.onchange=()=>{ const r=new FileReader(); r.onload=()=>{ try{ const data=JSON.parse(r.result); if(Array.isArray(data)) heads[hi].traps=data; rebuild(); updateSimplified(hi); }catch{alert("Ошибка файла"); } }; r.readAsText(i.files[0]); }; i.click(); }
function exportSVG(){ /* твоя реализация */ }
function exportDXF(){ /* твоя реализация */ }
function download(n,d){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([d])); a.download=n; a.click(); }

// ---------- Авто-упрощение ----------
function autoSimplifySet(hi){
  const simplified=optimizeTrapezoids(heads[hi].traps,15);
  addHead(heads[hi].name+"-упрощённая",heads[hi].color,heads[hi].alpha,simplified);
}

// ---------- Обновление упрощённого контура ----------
function updateSimplified(hi){
  simplifiedHeads[hi]=optimizeTrapezoids(heads[hi].traps,15);
  draw();
}

// ---------- Оптимизация трапеций ----------
function optimizeTrapezoids(traps,maxCount=15){
  if(traps.length<=maxCount) return [...traps];
  let yAcc=0; const segments=[];
  for(const t of traps){ segments.push({y0:yAcc,y1:yAcc+t.h,b1:t.b1,b2:t.b2}); yAcc+=t.h; }

  const n=segments.length;
  const dp=Array.from({length:n+1},()=>Array(maxCount+1).fill(Infinity));
  const back=Array.from({length:n+1},()=>Array(maxCount+1).fill(-1));
  dp[0][0]=0;

  function excessArea(segStart,segEnd){
    let hTotal=0,b1Max=0,b2Max=0;
    for(let i=segStart;i<segEnd;i++){ const s=segments[i]; hTotal+=s.y1-s.y0; b1Max=Math.max(b1Max,s.b1); b2Max=Math.max(b2Max,s.b2);}
    let areaNew=hTotal*( (b1Max+b2Max)/2 );
    let areaOld=0; for(let i=segStart;i<segEnd;i++){ const s=segments[i]; areaOld+=(s.y1-s.y0)*( (s.b1+s.b2)/2 ); }
    return areaNew-areaOld;
  }

  for(let i=1;i<=n;i++){ for(let k=1;k<=maxCount;k++){ for(let j=0;j<i;j++){
    const cost=dp[j][k-1]+excessArea(j,i); if(cost<dp[i][k]){ dp[i][k]=cost; back[i][k]=j; }}}}

  let k=maxCount,i=n,blocks=[];
  while(i>0 && k>0){ const j=back[i][k]; blocks.push([j,i]); i=j; k--; }
  blocks.reverse();

  const result=[];
  for(const [start,end] of blocks){
    let hTotal=0,b1Max=0,b2Max=0;
    for(let idx=start;idx<end;idx++){ const s=segments[idx]; hTotal+=s.y1-s.y0; b1Max=Math.max(b1Max,s.b1); b2Max=Math.max(b2Max,s.b2); }
    result.push({h:hTotal,b1:b1Max,b2:b2Max});
  }
  return result;
}

draw();
</script>
</body>
</html>
